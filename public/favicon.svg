<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1b080b" />
      <stop offset="70%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#e5e5e5" />
      <stop offset="70%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#58080f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#800a12" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Background Pill / Circle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#370c11" stroke-width="1.5" />
  <!-- Obsidian Wax Ring Accent -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#68121a" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.4" />
  <!-- Gothic Letter M -->
  <text 
    x="32" 
    y="44" 
    font-family="'UnifrakturMaguntia', 'Cinzel', serif" 
    font-size="36" 
    font-weight="bold" 
    text-anchor="middle" 
    fill="url(#mGrad)"
    filter="url(#glow)">M</text>
  <!-- Subtle diamond bottom notch -->
  <polygon points="32,53 34,55 32,57 30,55" fill="#991b1b" opacity="0.8" />
</svg>
